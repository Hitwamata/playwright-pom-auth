name: Testes Playwright

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar browsers do Playwright
        run: npx playwright install --with-deps chromium

      - name: Correr testes
        run: npx playwright test
        env:
          UTILIZADOR: ${{ secrets.UTILIZADOR || 'standard_user' }}
          PALAVRA_PASSE: ${{ secrets.PALAVRA_PASSE || 'secret_sauce' }}

      - name: Publicar relatório
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
